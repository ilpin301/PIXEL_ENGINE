; PlatformIO manifest, HOST (native) build only.
;
; Builds the same program as the CMake target pge_empty: pge_core + the null host platform
; (host_common, storage_file, display_null, input_null, audio_null) + examples/empty/main.cpp.
; Run: pio run -e native, then .pio/build/native/program[.exe] --seconds 1
;
; CMake stays the canonical build. The source list below mirrors core/CMakeLists.txt and
; platform/host/CMakeLists.txt; keep it in sync when files are added there.
; Only the host/native build is provided here. STM32F429I-DISCO and ESP32-S3 are NOT built
; through PlatformIO: use CMake for them (ESP32-S3 is deferred).

[platformio]
src_dir = .

[env:native]
platform = native
lib_ldf_mode = off
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
    -std=gnu++17
    -fno-exceptions
    -fno-rtti
    -Wall
    -Wextra
    -Icore/include
    -Ihal/include
    -Iplatform/host
; Whitelist only: nothing else under src_dir (build*/, tests, other examples, bench, tools, other platforms) is compiled.
build_src_filter =
    -<*>
    +<core/src/base/engine.cpp>
    +<core/src/base/version.cpp>
    +<core/src/gfx/gfx.cpp>
    +<core/src/gfx/draw.cpp>
    +<core/src/gfx/camera.cpp>
    +<core/src/gfx/font5x7.cpp>
    +<core/src/physics/collision.cpp>
    +<core/src/world/world.cpp>
    +<core/src/world/worldgen.cpp>
    +<core/src/entity/entity.cpp>
    +<core/src/entity/particles.cpp>
    +<core/src/storage/storage.cpp>
    +<core/src/storage/save.cpp>
    +<core/src/storage/settings.cpp>
    +<core/src/resource/resource.cpp>
    +<core/src/resource/asset.cpp>
    +<core/src/audio/audio.cpp>
    +<core/src/ui/ui.cpp>
    +<core/src/debug/overlay.cpp>
    +<platform/host/host_common.cpp>
    +<platform/host/storage_file.cpp>
    +<platform/host/display_null.cpp>
    +<platform/host/input_null.cpp>
    +<platform/host/audio_null.cpp>
    +<examples/empty/main.cpp>
